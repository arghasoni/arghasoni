name: Update Profile Cards

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:             # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
          LEETCODE_USER: arghasoni
        run: python scripts/update_cards.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/leetcode.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile cards [skip ci]"
          git push
